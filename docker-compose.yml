# Example deployment next to a Jellyfin container. Adjust paths, user and network to your server.
services:
  themarr:
    build: .
    container_name: themarr
    restart: unless-stopped
    # Same owner as the media files, so themes are never created as root
    user: "1000:1000"
    environment:
      - TZ=America/Sao_Paulo
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
    volumes:
      - ./config:/config
      # Must be the same folder Jellyfin sees as /data, so item paths match exactly.
      # Start read-only (:ro) and switch to read-write only once everything is verified.
      - /media/hd_ext/Medias:/data:ro
    ports:
      # Bound to localhost by default: expose it through your VPN (e.g. tailscale serve), never publicly
      - "${THEMARR_BIND:-127.0.0.1}:8686:8686"
    networks:
      - jellyfin_default

networks:
  jellyfin_default:
    external: true
