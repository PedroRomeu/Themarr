<!DOCTYPE html>
<html lang="en">
<head>
    {% include '_head.html' %}
    <title>Sign in · Themarr</title>
</head>
<body class="bg-page text-ink min-h-screen flex items-center justify-center p-5 text-sm">
    <form method="post" action="{{ url_for('login') }}" class="card shadow-2xl p-7 w-full max-w-sm space-y-4">
        <div class="flex flex-col items-center text-center pb-2">
            <img src="{{ url_for('static', filename='favicon.ico') }}" alt="" class="w-14 h-14 rounded-full">
            <h1 class="text-xl font-semibold mt-3">Themarr</h1>
            <p class="text-xs text-muted mt-1">Sign in with your Jellyfin administrator account.</p>
        </div>

        {% if error %}
        <p class="text-xs text-red-400 bg-red-500/10 border border-red-500/30 rounded-md px-3 py-2">{{ error }}</p>
        {% endif %}

        <input type="hidden" name="next" value="{{ next_url }}">
        <label class="block space-y-1.5"><span class="text-xs text-muted">Username</span>
            <input type="text" name="username" autocomplete="username" required autofocus class="field w-full py-2"></label>
        <label class="block space-y-1.5"><span class="text-xs text-muted">Password</span>
            <input type="password" name="password" autocomplete="current-password" class="field w-full py-2"></label>
        <button type="submit" class="btn btn-primary w-full justify-center py-2.5">Sign in</button>
    </form>
</body>
</html>
